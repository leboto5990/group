<!DOCTYPE html>
<html>
<head>
  <title>Admin Register</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .auth-container { max-width: 420px; width: 100%; padding: 20px; }
    .auth-form {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      color: white;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 25px;
    }
    .auth-brand i {
      font-size: 40px;
      color: #f59e0b;
      margin-bottom: 10px;
    }
    .auth-brand span {
      display: block;
      font-size: 22px;
      font-weight: 700;
    }
    .auth-form h3 {
      margin: 0 0 20px 0;
      font-size: 14px;
      color: #94a3b8;
      font-weight: 500;
      text-align: center;
    }
    input { width: 100%; padding: 14px 16px; margin: 8px 0; border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; box-sizing: border-box; background: rgba(255,255,255,0.08); color: white; font-size: 14px; outline: none; transition: border 0.2s; }
    input::placeholder { color: #64748b; }
    input:focus { border-color: #f59e0b; }
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
    }
    .auth-footer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #94a3b8;
    }
    .auth-footer a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-form">
    <div class="auth-brand">
      <i class="fas fa-user-shield"></i>
      <span>Admin Registration</span>
    </div>
    <h3>Create your admin account to get started</h3>
    <input id="email" type="email" placeholder="Email address">
    <input id="password" type="password" placeholder="Password (min 6 characters)">
    <button onclick="register()"><i class="fas fa-user-plus"></i> Register & Continue to Login</button>
    <p class="auth-footer">Already registered? <a href="admin-login.html">Login here <i class="fas fa-arrow-right"></i></a></p>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase.js';
  import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
  import { doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

  window.register = async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, 'users', userCredential.user.uid), {
        email,
        role: 'admin'
      });
      alert('Admin registered successfully! Please login.');
      window.location.href = 'admin-login.html';
    } catch (error) {
      if (error.code === 'auth/email-already-in-use') {
        alert('Email already registered. Please login instead.');
        window.location.href = 'admin-login.html';
      } else {
        alert(error.message);
      }
    }
  };

</script>

</body>
</html>
